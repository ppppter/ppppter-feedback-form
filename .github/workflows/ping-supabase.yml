name: Keep Supabase Alive

on:
  schedule:
    # 每天北京时间早上 7 点执行
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase feedback_records table
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET \
            "https://latgpdczgzrtiemkvowd.supabase.co/rest/v1/feedback_records?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase response status: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "Ping failed!"
            exit 1
          fi
          echo "Ping success!"
